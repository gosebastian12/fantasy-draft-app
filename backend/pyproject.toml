[project]
name = "fantasy-draft-api"
version = "0.1.0"
description = "Async FastAPI backend for the fantasy football draft application"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "PyJWT[crypto]>=2.8.0",
    "httpx>=0.27.0",
    "arq>=0.25.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
